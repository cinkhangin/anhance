name: Android checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Run tests, lint, and build checks
        run: >-
          ./gradlew --no-daemon -Pandroid.useAndroidX=true
          :anhance:testDebugUnitTest :anhance:lintDebug :anhance:lintRelease
          :anhance:assembleRelease :anhance:assembleDebugAndroidTest :example:assembleDebug
